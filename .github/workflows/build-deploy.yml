name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install uv
          cd backend
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          
      # The tests read the gated enhanced FRS. The job's GitHub OIDC token is
      # exchanged for a one-hour, read-only token from policyengine-auto's
      # Hugging Face CI/CD identity, so no Hugging Face secret is stored
      # (https://huggingface.co/docs/hub/trusted-publishers). A fork pull
      # request has no OIDC token and runs the tests without one.
      - name: Run tests
        env:
          HF_OIDC_RESOURCE: policyengine-auto
          HF_OIDC_OPTIONAL: "1"
        run: |
          cd backend
          source .venv/bin/activate
          ../.github/with-hf-token.sh pytest
        
      - name: Lint
        run: |
          cd backend
          source .venv/bin/activate
          ruff check .

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          
      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        
      - name: Build and push Docker image
        run: |
          # Configure docker to use gcloud as a credential helper
          gcloud auth configure-docker
          
          # Build and push the Docker image
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/uk-income-tax-freeze-app:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/uk-income-tax-freeze-app:${{ github.sha }}
          
          # Tag as latest
          docker tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/uk-income-tax-freeze-app:${{ github.sha }} gcr.io/${{ secrets.GCP_PROJECT_ID }}/uk-income-tax-freeze-app:latest
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/uk-income-tax-freeze-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          
      - name: Terraform Init
        run: |
          cd terraform
          terraform init
        
      # The service reads the gated enhanced FRS at runtime, so it needs a
      # stored, read-only token for
      # policyengine/policyengine-uk-data-private, kept in the repository
      # secret HF_RUNTIME_READ_TOKEN: never the org-wide HUGGING_FACE_TOKEN,
      # and never a one-hour OIDC token. Terraform reads it from
      # TF_VAR_hugging_face_token rather than the command line.
      - name: Check the runtime data token
        env:
          TF_VAR_hugging_face_token: ${{ secrets.HF_RUNTIME_READ_TOKEN }}
        run: |
          if [ -z "$TF_VAR_hugging_face_token" ]; then
            echo "::error::Set the repository secret HF_RUNTIME_READ_TOKEN to a read-only token for policyengine/policyengine-uk-data-private; deploying without it would leave the service unable to read its data."
            exit 1
          fi

      - name: Terraform Plan
        env:
          TF_VAR_hugging_face_token: ${{ secrets.HF_RUNTIME_READ_TOKEN }}
        run: |
          cd terraform
          terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="container_tag=${{ github.sha }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          TF_VAR_hugging_face_token: ${{ secrets.HF_RUNTIME_READ_TOKEN }}
        run: |
          cd terraform
          terraform apply -auto-approve -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="container_tag=${{ github.sha }}"
